{% extends 'base.html' %}
{% load static %}
{% block title %}Login — KenaKata{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <div class="kk-logo-icon mx-auto mb-3" style="width:56px;height:56px;font-size:26px;border-radius:16px;">
          <i class="bi bi-bag-heart-fill"></i>
        </div>
        <h1 class="h4 fw-800" style="color:var(--kk-gray-900);">Welcome Back</h1>
        <p class="text-muted small">Login to your KenaKata account</p>
      </div>
      <div class="kk-card">
        <div class="kk-card-body">
          <form method="POST">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="kk-form-group">
              <label class="kk-label required">Username, Email or Mobile</label>
              <input type="text" name="email" class="kk-input {% if has_error %}is-invalid{% endif %}" placeholder="admin, your@gmail.com, or 017XXXXXXXX"
                     value="{{ form_data.email|default:'' }}" required autofocus>
            </div>
            <div class="kk-form-group">
              <label class="kk-label required">Password</label>
              <div class="position-relative">
                <input type="password" name="password" class="kk-input {% if has_error %}is-invalid{% endif %}" placeholder="Your password"
                       id="passwordInput" required style="padding-right:44px;">
                <button type="button" onclick="togglePassword('passwordInput', this)"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--kk-gray-400);cursor:pointer;font-size:16px;">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-kk-primary w-100 mt-2" style="justify-content:center;padding:13px;">
              <i class="bi bi-box-arrow-in-right"></i> Login to KenaKata
            </button>
          </form>
        </div>
      </div>
      <div class="text-center mt-3">
        <span class="text-muted small">Don't have an account? </span>
        <a href="/auth/register/" style="color:var(--kk-primary);font-weight:600;">Create Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') { input.type = 'text'; btn.querySelector('i').className = 'bi bi-eye-slash'; }
  else { input.type = 'password'; btn.querySelector('i').className = 'bi bi-eye'; }
}
</script>
{% endblock %}
