{% extends 'base.html' %}
{% load static %}
{% block title %}Change Password — KenaKata{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-3">{% include 'dashboard/sidebar.html' %}</div>
    <div class="col-lg-9">
      <div class="kk-card">
        <div class="kk-card-header"><span class="fw-700 h5 mb-0"><i class="bi bi-lock me-2"></i>Change Password</span></div>
        <div class="kk-card-body" style="max-width:480px;">
          <form method="POST">
            {% csrf_token %}
            <div class="kk-form-group">
              <label class="kk-label required">Current Password</label>
              <input type="password" name="current_password" class="kk-input" required>
            </div>
            <div class="kk-form-group">
              <label class="kk-label required">New Password</label>
              <input type="password" name="new_password" class="kk-input" placeholder="Min. 8 characters" required>
            </div>
            <div class="kk-form-group">
              <label class="kk-label required">Confirm New Password</label>
              <input type="password" name="confirm_password" class="kk-input" required>
            </div>
            <button type="submit" class="btn-kk-primary"><i class="bi bi-lock-fill"></i> Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
