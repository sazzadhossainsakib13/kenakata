{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error (500) — KenaKata{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 text-center py-5">
      <div class="mb-4" style="font-size: 100px; font-weight: 900; line-height: 1; color: var(--kk-danger);">
        500
      </div>
      <h1 class="h3 fw-800 mb-2" style="color: var(--kk-gray-900);">Something went wrong on our end</h1>
      <p class="text-muted mb-4" style="font-size: 15px;">We are experiencing a temporary issue. Please try refreshing the page or try again in a few moments.</p>
      <div class="d-flex gap-3 justify-content-center flex-wrap">
        <a href="/" class="btn-kk-primary" style="padding: 12px 28px;">
          <i class="bi bi-house-fill me-1"></i> Back to Home
        </a>
        <button onclick="window.location.reload()" class="btn-kk-outline" style="padding: 11px 26px;">
          <i class="bi bi-arrow-clockwise me-1"></i> Refresh Page
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
